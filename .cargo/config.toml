# Browser build: getrandom 0.3+ requires this cfg flag (the `wasm_js` cargo
# feature alone is not enough) for wasm32-unknown-unknown.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-gnu]
rustflags = [
    # Required for mimalloc
    "-C",
    "link-arg=-lpsapi",
]

# Clever way to get workspace dir, from https://github.com/rust-lang/cargo/issues/3946#issuecomment-973132993
[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }

[alias]
# tools
check-wasm = "check --target wasm32-unknown-unknown -p lemoncraft-voxygen --no-default-features --features wasm-singleplayer"
cmd-doc-gen = "run --features=bin_cmd_doc_gen --bin cmd_doc_gen"
csv-export = "run --manifest-path common/Cargo.toml --features=bin_csv --bin csv_export"
csv-import = "run --manifest-path common/Cargo.toml --features=bin_csv --bin csv_import"
find_unused = "run --manifest-path common/Cargo.toml --bin find_unused"
dot-recipes = "run --manifest-path common/Cargo.toml --features=bin_graphviz --bin recipe_graphviz"
dot-skills = "run --manifest-path common/Cargo.toml --features=bin_graphviz --bin skill_graphviz"
img-export = "run --manifest-path voxygen/Cargo.toml --features=bin_img-export --bin img-export"
# server-cli
server = "run --bin lemoncraft-server-cli"
test-server = "run --bin lemoncraft-server-cli --no-default-features --features simd"
tracy-server = "run --bin lemoncraft-server-cli --features tracy,simd --profile no_overflow"
tracy-server-debuginfo = "run --bin lemoncraft-server-cli --features tracy,simd --profile no_overflow_debuginfo"
tracy-server-releasedebuginfo = "run --bin lemoncraft-server-cli --features tracy,simd --profile releasedebuginfo"
tracy-test-server = "run --bin lemoncraft-server-cli --no-default-features --features tracy,simd --profile no_overflow"
# voxygen
test-voxygen = "run --bin lemoncraft-voxygen --no-default-features --features simd,egui-ui,shaderc-from-source,hot-reloading"
tracy-voxygen = "run --bin lemoncraft-voxygen --no-default-features --features tracy,simd,egui-ui,shaderc-from-source --profile no_overflow"
dbg-voxygen = "run --bin lemoncraft-voxygen --profile debuginfo"
# misc
swarm = "run --bin swarm --features client/bin_bot,client/tick_network --"
ci-clippy = "clippy --all-targets --locked --features=bin_cmd_doc_gen,bin_compression,bin_csv,bin_graphviz,bin_bot,bin_asset_migrate,bin,stat"
ci-clippy2 = "clippy -p lemoncraft-voxygen --locked --no-default-features --features=default-publish"
