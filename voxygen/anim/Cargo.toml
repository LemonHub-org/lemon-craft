[package]
name = "lemoncraft-voxygen-anim"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
use-dyn-lib = ["lazy_static", "common-dynlib"]
be-dyn-lib = []
simd = ["vek/platform_intrinsics"]

default = ["simd"]

[dependencies]
common = {package = "lemoncraft-common", path = "../../common"}
bytemuck = { version = "1.4", features=["derive"] }
vek = { workspace = true }
common-dynlib = {package = "lemoncraft-common-dynlib", path = "../../common/dynlib", optional = true}
inline_tweak = { workspace = true, features = ["derive"] }

# Hot Reloading
lazy_static = { workspace = true, optional = true}
