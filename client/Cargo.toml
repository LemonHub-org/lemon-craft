[package]
name = "lemoncraft-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
simd = ["vek/platform_intrinsics"]
quic = ["network/quic", "dep:quinn", "dep:rustls", "dep:hickory-resolver"]
networking = ["network/networking"]
bin_bot = [
    "serde",
    "ron",
    "clap",
    "rustyline",
    "common-frontend",
    "async-channel",
    "voxygen-i18n-helpers",
    "client-i18n",
    "auth",
]
tracy = ["common-base/tracy"]
tick_network = []
# Auth-server login flow (hyper/rustls; native only)
auth = ["dep:authc"]
# Browser singleplayer build: no sockets, DNS, QUIC/TLS, or auth in the feature
# graph.
wasm-singleplayer = []

default = ["simd", "quic", "auth", "networking"]

[dependencies]
common = { package = "lemoncraft-common", path = "../common", features = [
    "no-assets",
] }
common-base = { package = "lemoncraft-common-base", path = "../common/base" }
common-state = { package = "lemoncraft-common-state", path = "../common/state", default-features = false }
common-systems = { package = "lemoncraft-common-systems", path = "../common/systems", default-features = false }
common-net = { package = "lemoncraft-common-net", path = "../common/net" }
network = { package = "lemoncraft-network", path = "../network", features = [
    "compression",
], default-features = false }

byteorder = "1.3.2"
tokio = { workspace = true, features = ["rt"] }
quinn = { workspace = true, features = ["rustls"], optional = true }
rustls = { workspace = true, optional = true }
hickory-resolver = { version = "0.26.1", features = [
    "system-config",
    "tokio",
], optional = true }
image = { workspace = true }
num = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }
specs = { workspace = true, features = [
    "serde",
    "storage-event-control",
    "derive",
] }
vek = { workspace = true }
hashbrown = { workspace = true }
authc = { git = "https://gitlab.com/veloren/auth.git", rev = "ae0e16783a9f9041951296885f082308e155db79", optional = true } # xMAC94x/current_master_till_refactored branch

#TODO: put bot in a different crate
#bot only
async-channel = { version = "2.1", optional = true }
voxygen-i18n-helpers = { package = "lemoncraft-voxygen-i18n-helpers", path = "../voxygen/i18n-helpers", optional = true }
client-i18n = { package = "lemoncraft-client-i18n", path = "i18n", optional = true }
common-i18n = { package = "lemoncraft-common-i18n", path = "../common/i18n"}
serde = { workspace = true, features = ["rc"], optional = true }
ron = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
rustyline = { version = "18", optional = true }
## logging
common-frontend = { package = "lemoncraft-common-frontend", path = "../common/frontend", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
voxygen-i18n-helpers = { package = "lemoncraft-voxygen-i18n-helpers", path = "../voxygen/i18n-helpers" }
client-i18n = { package = "lemoncraft-client-i18n", path = "i18n" }

[[example]]
name = "chat_cli"
required-features = ["bin_bot"]

[[bin]]
name = "bot"
required-features = ["bin_bot"]

[[bin]]
name = "swarm"
required-features = ["bin_bot", "tick_network"]
